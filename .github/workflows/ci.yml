name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install swift-format
        run: |
          brew update
          brew install swift-format

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      # The default plan is the unit bundle. The UI tests are their own job
      # below: driven from the same xcodebuild as the unit bundle, which is
      # hosted in the app, they leave the app unable to open a window, and every
      # test from that point on fails in its setup.
      - name: Build, Analyze, and Test
        run: >
          xcodebuild clean analyze test
          -project "Front Row.xcodeproj"
          -scheme "Front Row"
          -testPlan "Front Row"
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult

  scripts:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cmark-gfm
        run: |
          brew update
          brew install cmark-gfm

      - name: Run script tests
        run: |
          failures=0
          for test in scripts/*.test.sh; do
            echo "==> $test"
            "$test" || failures=$((failures + 1))
          done
          exit "$failures"

  ui-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Signed ad-hoc rather than not at all. CODE_SIGNING_ALLOWED=NO leaves
      # Front Row UI Tests-Runner.app without a code identity, and Gatekeeper
      # then assesses every launch - the run takes about two and a half times
      # as long, and locally the runner is refused outright as damaged.
      - name: Run UI tests
        run: >
          xcodebuild test
          -project "Front Row.xcodeproj"
          -scheme "Front Row"
          -testPlan "UI"
          -destination "platform=macOS"
          -resultBundlePath UITestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES

      # The screenshots and the accessibility hierarchy behind a failure, which
      # are the only account of one that happens on the runner and not here.
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
