name: CI

on:
  push:
    branches: ["main"]
  # Every pull request, whatever it targets. Filtering on `main` would leave a
  # stacked PR - one based on the branch below it - with no checks at all.
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install swift-format
        run: |
          brew update
          brew install swift-format

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      - name: Build, Analyze, and Test
        run: >
          xcodebuild clean analyze test
          -project "Front Row.xcodeproj"
          -scheme "Front Row"
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      # The UI tests' screenshots and failure details live here, and a failed run
      # is the only time anyone wants them.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
