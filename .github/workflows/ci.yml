name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install swift-format and ffmpeg
        run: |
          brew update
          brew install swift-format ffmpeg

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      - name: Build, Analyze, and Test
        run: >
          xcodebuild clean analyze test
          -project "Front Row.xcodeproj"
          -scheme "Front Row"
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES | xcpretty && exit ${PIPESTATUS[0]}

      # xcpretty prints the name of a failing swift-testing test and nothing else, so the
      # expectations that went down are read out of the result bundle here.
      - name: Report test failures
        if: failure()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact \
            | python3 -c '
          import json, sys

          def walk(node, test=None):
              if node.get("nodeType") == "Test Case":
                  test = node.get("name")
              if node.get("nodeType") == "Failure Message":
                  where = node.get("sourceLocation", {})
                  file = where.get("filePath", "?").split("/")[-1]
                  line = where.get("lineNumber", "?")
                  print("%s\n    %s\n    %s:%s" % (test, node.get("name"), file, line))
              for child in node.get("children") or []:
                  walk(child, test)

          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node)
          '

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult

  scripts:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cmark-gfm
        run: |
          brew update
          brew install cmark-gfm

      - name: Run script tests
        run: |
          failures=0
          for test in scripts/*.test.sh; do
            echo "==> $test"
            "$test" || failures=$((failures + 1))
          done
          exit "$failures"
