name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install swift-format and ffmpeg
        run: |
          brew update
          brew install swift-format ffmpeg

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      - name: Build, Analyze, and Test
        run: >
          xcodebuild clean analyze test
          -project "Front Row.xcodeproj"
          -scheme "Front Row"
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  scripts:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cmark-gfm
        run: |
          brew update
          brew install cmark-gfm

      - name: Run script tests
        run: |
          failures=0
          for test in scripts/*.test.sh; do
            echo "==> $test"
            "$test" || failures=$((failures + 1))
          done
          exit "$failures"
