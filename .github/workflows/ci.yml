name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project uses Xcode's JSON project format (project.xcproj), which
      # needs Xcode 27.2. The xcode-27 image defaults to an older Xcode 27.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Install swift-format and ffmpeg
        run: |
          brew update
          brew install swift-format ffmpeg

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      - name: Build, Analyze, and Test
        run: >
          xcodebuild clean analyze test
          -project "Front Row.xcodeproj"
          -scheme "Front Row"
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES | xcpretty && exit ${PIPESTATUS[0]}

      - name: Report test failures
        if: failure()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact \
            | python3 -c '
          import json, sys

          def walk(node, test=None):
              if node.get("nodeType") == "Test Case":
                  test = node.get("name")
              if node.get("nodeType") == "Failure Message":
                  where = node.get("sourceLocation", {})
                  file = where.get("filePath", "?").split("/")[-1]
                  line = where.get("lineNumber", "?")
                  print("%s\n    %s\n    %s:%s" % (test, node.get("name"), file, line))
              for child in node.get("children") or []:
                  walk(child, test)

          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node)
          '

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult

  scripts:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cmark-gfm
        run: |
          brew update
          brew install cmark-gfm

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: v1.26.0

      # Every fragment must parse and have a known kind, or the release would
      # fail at its first step.
      - name: Check the Changie fragments
        run: |
          set -euo pipefail
          if compgen -G ".changes/unreleased/*.yaml" >/dev/null; then
            changie batch auto --dry-run
          else
            echo "No unreleased changes"
          fi

      - name: Run script tests
        run: |
          failures=0
          for test in scripts/*.test.sh; do
            echo "==> $test"
            "$test" || failures=$((failures + 1))
          done
          exit "$failures"
