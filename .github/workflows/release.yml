# Description:
# Builds, signs, notarizes, and publishes a new release, then adds it to the
# Sparkle appcast. Triggered manually from the Actions tab.
#         1. Each user-facing change adds a Changie fragment (`changie new`,
#            see .changes/README.md)
#         2. Choose the release type (auto picks it from the fragments' kinds)
#
# Changie batches the fragments into .changes/<version>.md, updates
# CHANGELOG.md, and stamps MARKETING_VERSION into project.xcproj. The notes go
# to GitHub as Markdown and to the appcast as HTML, rendered by cmark-gfm so
# both read the same. The build number is the commit count; it is passed to the
# build and recorded in project.xcproj with the release commit. fastlane (fastlane/Fastfile) imports the
# certificate, archives, exports, and notarizes.
#
# Nothing outside the runner is touched until notarization succeeds, so a failed
# run leaves no tag, no release, and no feed change behind — just run it again.
#
# The release commit (appcast, version, notes) is made first and is the
# commit that gets tagged, so the tag's source reports the version it shipped as.
# It is pushed to main last: the appcast links to the release's dmg, so the feed
# only goes live once that download exists.
#
# 🚨 GITHUB SECRETS REQUIRED:
#         - DEVELOPER_ID_CERT_P12_BASE64: Developer ID Application certificate
#           exported from Keychain Access with its private key, as .p12, then
#           `base64 -i cert.p12 | pbcopy`
#         - DEVELOPER_ID_CERT_PASSWORD: password set during that export
#         - AC_API_KEY_P8_BASE64: App Store Connect API key (.p8), base64 encoded
#         - AC_API_KEY_ID / AC_API_ISSUER_ID: shown alongside the key
#         - SPARKLE_ED_PRIVATE_KEY: EdDSA key, via `generate_keys -x key.txt`
#
# The certificate expires (5 years); the API key and EdDSA key do not.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: "Release type: auto (from the Changie fragments), patch, minor, major"
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry-run:
        type: boolean
        description: "Build and notarize only — no tag, release, or appcast update (any branch)"
        required: false
        default: false

# Two runs would resolve the same tag and build number, both pass the guards
# below, then collide at tag and appcast push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      TEAM_ID: TCQ6328PP6

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A shallow clone makes `git rev-list --count` return 1, which is below
          # the shipped build number and would strand every existing user.
          fetch-depth: 0

      # The project uses Xcode's JSON project format (project.xcproj), which
      # needs Xcode 27.2. The xcode-27 image defaults to an older Xcode 27.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      # Build output must stay outside the workspace: the app target's
      # swift-format lint phase runs `-r ./` from $SRCROOT and would lint SPM's
      # checkout of Sparkle. fastlane builds into BUILD_ROOT.
      - name: Set build paths
        run: |
          set -euo pipefail
          {
            echo "BUILD_ROOT=$RUNNER_TEMP/build"
            echo "EXPORT_PATH=$RUNNER_TEMP/build/export"
            echo "DERIVED_DATA=$RUNNER_TEMP/build/DerivedData"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db"
            echo "BUNDLE_PATH=$RUNNER_TEMP/gems"
          } >>"$GITHUB_ENV"

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: v1.26.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # Gems stay outside the workspace (BUNDLE_PATH) for the same reason as the
      # build output: the lint phase would lint the fastlane gem's Swift files.
      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gems
          key: gems-${{ runner.os }}-ruby3.4-${{ hashFiles('Gemfile.lock') }}

      - name: Install fastlane
        run: bundle install

      - name: Install cmark-gfm
        run: brew install cmark-gfm

      # Before anything depends on these scripts.
      - name: Verify script tests pass
        run: |
          ./scripts/append-appcast-item.test.sh
          ./scripts/render-notes.test.sh

      # Everything below the build is expensive; fail here instead.
      - name: Resolve version and build number
        id: version
        run: |
          set -euo pipefail

          # The appcast is published from main (SUFeedURL points at
          # raw/main/.sparkle/appcast.xml). Releasing from anywhere else would
          # tag and publish, then strand the feed entry on a side branch. A dry
          # run publishes nothing, so it can run from any branch.
          if [[ "$GITHUB_REF_NAME" != "main" && "${{ inputs.dry-run }}" != "true" ]]; then
            echo "::error::Releases must be run from main, not $GITHUB_REF_NAME"
            exit 1
          fi

          # `changie batch patch` happily releases nothing, so check first.
          if ! compgen -G ".changes/unreleased/*.yaml" >/dev/null; then
            echo "::error::No unreleased changes. Add fragments with \`changie new\` before releasing."
            exit 1
          fi

          current="$(changie latest)"
          changie batch "${{ inputs.release-type }}"
          changie merge
          version="$(changie latest)"
          build="$(git rev-list --count HEAD)"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          newest="$(grep -o '<sparkle:version>[0-9]*</sparkle:version>' .sparkle/appcast.xml |
            grep -o '[0-9]*' | sort -n | tail -1)"
          if (( build <= newest )); then
            echo "::error::Build number $build does not exceed the newest appcast entry ($newest). Sparkle would never offer this update."
            exit 1
          fi

          # The release body: the version file without its "## version - date"
          # heading and the blank line after it.
          notes="$RUNNER_TEMP/notes.md"
          tail -n +3 ".changes/$version.md" >"$notes"
          [[ -s "$notes" ]] || { echo "::error::.changes/$version.md has no notes"; exit 1; }

          {
            echo "version=$version"
            echo "build=$build"
            echo "notes=$notes"
            echo "dmg=FrontRow_v$version.dmg"
          } >>"$GITHUB_OUTPUT"

          echo "Releasing $version ($build), bumped from $current"

      # GitHub gets the Markdown as written; the appcast gets this. Rendered
      # here so malformed notes fail before the build rather than after it.
      - name: Render the release notes for the appcast
        run: |
          set -euo pipefail
          html="$RUNNER_TEMP/notes.html"
          ./scripts/render-notes.sh "${{ steps.version.outputs.notes }}" >"$html"
          echo "NOTES_HTML=$html" >>"$GITHUB_ENV"
          cat "$html"

      - name: Prepare App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode >"$key"
          chmod 600 "$key"
          [[ -s "$key" ]] || { echo "::error::AC_API_KEY_P8_BASE64 decoded to an empty file"; exit 1; }
          echo "AC_KEY_PATH=$key" >>"$GITHUB_ENV"

      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: bundle exec fastlane import_signing_certificate

      # Cheap checks, before the ~15 minute build.
      - name: Preflight — verify credentials
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$KEYCHAIN_PATH"

          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in the keychain. Check DEVELOPER_ID_CERT_P12_BASE64 and DEVELOPER_ID_CERT_PASSWORD, and that the .p12 was exported with its private key."
            security find-identity -v "$keychain" || true
            exit 1
          fi
          echo "Signing identity: $identity"

          # Diagnostic only: an unreadable certificate warns, but an expired one
          # stops the build.
          certs="$RUNNER_TEMP/certcheck"
          rm -rf "$certs" && mkdir -p "$certs"
          expiry=""
          if security find-certificate -c "$identity" -p "$keychain" >"$certs/cert.pem" 2>/dev/null &&
            [[ -s "$certs/cert.pem" ]]; then
            expiry="$(openssl x509 -in "$certs/cert.pem" -noout -enddate 2>/dev/null | cut -d= -f2 || true)"
          fi
          expiry_epoch="$(date -j -f "%b %d %T %Y %Z" "$expiry" +%s 2>/dev/null || echo 0)"
          if (( expiry_epoch > 0 )); then
            days=$(( (expiry_epoch - $(date +%s)) / 86400 ))
            echo "Certificate expires in $days days ($expiry)"
            if (( days < 0 )); then
              echo "::error::The signing certificate expired on $expiry. Create a new Developer ID Application certificate and update DEVELOPER_ID_CERT_P12_BASE64."
              exit 1
            elif (( days < 30 )); then
              echo "::warning::The signing certificate expires in $days days ($expiry). Renew it before the next release."
            fi
          else
            echo "::warning::Could not parse the certificate expiry ('$expiry')"
          fi

          if ! xcrun notarytool history \
            --key "$AC_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            >/dev/null 2>&1; then
            echo "::error::The App Store Connect API key was rejected. Check AC_API_KEY_P8_BASE64, AC_API_KEY_ID, and AC_API_ISSUER_ID, and that the key has not been revoked."
            exit 1
          fi
          echo "App Store Connect API key accepted"

      - name: Archive and export
        run: >
          bundle exec fastlane build
          version:${{ steps.version.outputs.version }}
          build:${{ steps.version.outputs.build }}

      - name: Verify the exported app
        run: |
          set -euo pipefail
          app="$EXPORT_PATH/Front Row.app"
          actual_build="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Contents/Info.plist")"
          actual_version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")"

          [[ "$actual_build" == "${{ steps.version.outputs.build }}" ]] ||
            { echo "::error::CFBundleVersion is $actual_build, expected ${{ steps.version.outputs.build }}"; exit 1; }
          [[ "$actual_version" == "${{ steps.version.outputs.version }}" ]] ||
            { echo "::error::CFBundleShortVersionString is $actual_version, expected ${{ steps.version.outputs.version }}"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"

          # The archive may carry a development signature; only the export
          # re-signs for distribution.
          authority="$(codesign -dvvv "$app" 2>&1 | sed -n 's/^Authority=//p' | head -1)"
          case "$authority" in
            "Developer ID Application"*) ;;
            *) echo "::error::Signed by '$authority', expected a Developer ID Application certificate"; exit 1 ;;
          esac

          echo "Verified $actual_version ($actual_build), signed by: $authority"

      - name: Create dmg
        run: |
          set -euo pipefail
          # sindresorhus/create-dmg, not the similarly named Homebrew formula —
          # they take different flags.
          npm install -g create-dmg
          brew install graphicsmagick imagemagick

          cd "$EXPORT_PATH"
          create-dmg --no-code-sign "Front Row.app"
          mv ./*.dmg "${{ steps.version.outputs.dmg }}"

      - name: Notarize and staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: bundle exec fastlane notarize_dmg dmg:"$EXPORT_PATH/${{ steps.version.outputs.dmg }}"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload dmg as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.dmg }}
          path: ${{ env.EXPORT_PATH }}/${{ steps.version.outputs.dmg }}

      # ---- Nothing above this line changes anything outside the runner. ----

      # Committed but not pushed: the tag below points at this commit, and main
      # only gets it once the release (and the dmg the appcast links to) exists.
      - name: Commit the release
        id: record
        if: ${{ !inputs.dry-run }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="${{ steps.version.outputs.version }}"
          dmg="$EXPORT_PATH/${{ steps.version.outputs.dmg }}"
          sign_update="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"

          # Prints: sparkle:edSignature="..." length="..."
          signed="$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$dmg")"
          signature="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$signed")"
          length="$(sed -n 's/.*length="\([^"]*\)".*/\1/p' <<<"$signed")"
          [[ -n "$signature" && -n "$length" ]] ||
            { echo "::error::Could not parse sign_update output: $signed"; exit 1; }

          minimum_system_version="$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" \
            "$EXPORT_PATH/Front Row.app/Contents/Info.plist")"

          ./scripts/append-appcast-item.sh \
            --appcast .sparkle/appcast.xml \
            --version "$version" \
            --build "${{ steps.version.outputs.build }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$version/${{ steps.version.outputs.dmg }}" \
            --signature "$signature" \
            --length "$length" \
            --notes "$NOTES_HTML" \
            --pub-date "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
            --minimum-system-version "$minimum_system_version"

          # Changie's batch and merge already ran: the fragments became
          # .changes/$version.md, CHANGELOG.md was regenerated, and project.xcproj
          # carries the new marketing version.
          # Record the shipped build number too, so local builds report what last
          # shipped. Changie stamps only the marketing version.
          xcrun xcodeproj setting set --project "Front Row.xcodeproj" CURRENT_PROJECT_VERSION "${{ steps.version.outputs.build }}"

          git add -A .sparkle/appcast.xml .changes CHANGELOG.md "Front Row.xcodeproj/project.xcproj"
          git commit -m "chore: release $version (${{ steps.version.outputs.build }}) [skip ci]"

          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Tag and create the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          git tag "v$version" "${{ steps.record.outputs.commit }}"
          git push origin "v$version"

          gh release create "v$version" \
            "$EXPORT_PATH/${{ steps.version.outputs.dmg }}" \
            --title "v$version" \
            --notes-file "${{ steps.version.outputs.notes }}" ||
            { echo "::error::Tag v$version is pushed, but creating the GitHub release failed, and main is not updated. Delete the tag (git push origin :v$version) and run again."; exit 1; }

      - name: Publish to the appcast and record the version
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          failed() {
            echo "::error::$1 The release is published but users will not be offered it until .sparkle/appcast.xml is updated on main. Cherry-pick the tagged commit onto main: git fetch origin tag v$version && git cherry-pick v$version"
            exit 1
          }

          # The release is already public by this point, so a rejected push would
          # leave the feed permanently missing it. Rebase onto whatever landed on
          # main during the run and retry. After a rebase, main carries a copy of
          # the tagged commit with the same changes.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            ((attempt < 3)) || break
            echo "Push rejected (attempt $attempt), rebasing onto main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              failed "Rebasing the appcast update onto main conflicted."
            fi
          done

          failed "Could not push the appcast update after 3 attempts."
